name: Build Baikal image

on:
  schedule:
    - cron: "17 4 * * *"        # daily: check for a new upstream release
  workflow_dispatch:
    inputs:
      version:
        description: "Baikal version (empty = latest upstream release)"
        required: false
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and image name
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh api repos/sabre-io/Baikal/releases/latest --jq .tag_name)
          fi
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/baikal"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Baikal $VERSION -> $IMAGE"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled run if this version is already built
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag exists already, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5,linux/386
          build-args: BAIKAL_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
